<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Beat - 3D Synthwave Ritim Oyunu</title>
    <!-- Outfit Font from Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03001e;
            --primary-glow: #ff007f; /* Neon Pink/Magenta */
            --secondary-glow: #00f2fe; /* Cyber Teal */
            --accent-glow: #ffd700; /* Gold */
            --perfect-color: #00ffcc; /* Bright Turquoise */
            --container-bg: rgba(8, 4, 25, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0f0426 0%, var(--bg-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            touch-action: none;
        }

        .wrapper {
            background: var(--container-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        inset 0 0 20px rgba(255, 0, 127, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            width: min(95vw, 450px);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2.5px;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.35);
            margin-bottom: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .stats-panel {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            width: 100%;
            justify-content: space-between;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            transition: transform 0.1s ease;
        }

        .score-box .stat-value {
            color: var(--secondary-glow);
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        .combo-box .stat-value {
            color: var(--perfect-color);
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        .best-box .stat-value {
            color: var(--accent-glow);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .canvas-container {
            position: relative;
            padding: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
            width: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            border-radius: 15px;
            background: rgba(4, 1, 18, 0.98);
            width: 100%;
            height: 480px;
            cursor: pointer;
        }

        .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .screen-overlay {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: rgba(5, 2, 20, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .screen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .screen-overlay h2 {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--primary-glow);
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .screen-overlay p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            font-weight: 400;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }

        .screen-overlay p span {
            font-weight: 800;
            color: var(--secondary-glow);
        }

        .btn {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.15), rgba(255, 0, 127, 0.15));
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #ffffff;
            padding: 13px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.3), rgba(255, 0, 127, 0.3));
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.3);
            border-color: var(--secondary-glow);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Perfect pop visual feedback text */
        .feedback-text {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            font-size: 2.2rem;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .feedback-text.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-perfect {
            color: var(--perfect-color);
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.8), 0 0 40px rgba(0, 255, 204, 0.4);
        }

        .feedback-great {
            color: var(--secondary-glow);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        .feedback-good {
            color: var(--accent-glow);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .feedback-miss {
            color: #ff3300;
            text-shadow: 0 0 20px rgba(255, 51, 0, 0.8);
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 16px;
                border-radius: 20px;
                gap: 12px;
            }
            canvas {
                height: 400px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>Neon Beat</h1>
        
        <div class="stats-panel">
            <div class="stat-box score-box">
                <span class="stat-label">Skor</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box combo-box">
                <span class="stat-label">Kombo</span>
                <span class="stat-value" id="combo">0</span>
            </div>
            <div class="stat-box best-box">
                <span class="stat-label">En İyi</span>
                <span class="stat-value" id="bestScore">0</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            
            <!-- Timing feedback visual text -->
            <div class="feedback-text" id="feedbackText">KUSURSUZ!</div>
            
            <!-- Start screen -->
            <div class="screen-overlay active" id="startScreen">
                <h2 style="color: var(--primary-glow); text-shadow: 0 0 25px rgba(255, 0, 127, 0.6);">Synthwave Ritim</h2>
                <p>80'lerin retro temposuna ayak uydur. Klavyede <b>D - F - J - K</b> tuşlarını kullan veya mobilde şeritlere dokun!</p>
                <button class="btn" id="startBtn">Ritme Katıl</button>
            </div>

            <!-- Game Over screen -->
            <div class="screen-overlay" id="gameOverScreen">
                <h2>RİTİM BİTTİ!</h2>
                <p>Ulaşılan Siber Skor: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">Yeniden Yükle</button>
            </div>
        </div>
        
        <div class="hint">Sol şeritler: <b>D</b>, <b>F</b> | Sağ şeritler: <b>J</b>, <b>K</b></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const bestScoreEl = document.getElementById('bestScore');
        const finalScoreEl = document.getElementById('finalScore');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const feedbackText = document.getElementById('feedbackText');

        // Timing definitions (tolerances in seconds)
        const PERFECT_WINDOW = 0.08; // +/- 80ms
        const GREAT_WINDOW = 0.16;   // +/- 160ms
        const GOOD_WINDOW = 0.27;    // +/- 270ms

        // Music speed configurations
        const NOTE_TRAVEL_TIME = 1.6; // Time it takes to travel down the perspective lane (seconds)
        const BPM = 122;
        const BEAT_INTERVAL = 60 / BPM; // ~0.4918 seconds per beat

        // Web Audio Synth Engine
        let audioCtx = null;
        let analyserNode = null;
        let freqData = new Uint8Array(0);

        let nextNoteTime = 0;
        let lastScheduledBeat = -1;
        let beatCounter = 0;
        let schedulerInterval = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Analyser node for real-time visualizer spectrum
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 64; // Small fft for quick responsive equalizers
            analyserNode.connect(audioCtx.destination);
            
            freqData = new Uint8Array(analyserNode.frequencyBinCount);
        }

        // Sentezleyici: Elektronik 80'ler Bas Pluck Sesi
        function playBassPluck(freq, time) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();

            // Sawtooth wave for juicy retro synth sounds
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, time);
            filter.frequency.exponentialRampToValueAtTime(80, time + 0.22);

            gainNode.gain.setValueAtTime(0.24, time);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, time + 0.24);

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(analyserNode); // Route to visualizer

            osc.start(time);
            osc.stop(time + 0.25);
        }

        // Sentezleyici: Kick Drum (Bas Vuruşu)
        function playKick(time) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.12);

            gainNode.gain.setValueAtTime(0.35, time);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);

            osc.connect(gainNode);
            gainNode.connect(analyserNode);

            osc.start(time);
            osc.stop(time + 0.15);
        }

        // Sentezleyici: Snare Drum (Trampet Vuruşu)
        function playSnare(time) {
            if (!audioCtx) return;

            // Generate noise
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.18, time);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

            noiseNode.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(analyserNode);

            // Snare pitch snap
            const snapOsc = audioCtx.createOscillator();
            const snapGain = audioCtx.createGain();
            snapOsc.type = 'triangle';
            snapOsc.frequency.setValueAtTime(180, time);
            snapGain.gain.setValueAtTime(0.12, time);
            snapGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);

            snapOsc.connect(snapGain);
            snapGain.connect(analyserNode);

            noiseNode.start(time);
            snapOsc.start(time);
            noiseNode.stop(time + 0.16);
            snapOsc.stop(time + 0.16);
        }

        // Sentezleyici: Hi-Hat
        function playHiHat(time) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(8000, time);

            filter.type = 'highpass';
            filter.frequency.value = 7000;

            gainNode.gain.setValueAtTime(0.04, time);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(analyserNode);

            osc.start(time);
            osc.stop(time + 0.06);
        }

        // Successful Hit sound plucks (Polyphonic overlay)
        function playHitSynth(lane) {
            if (!audioCtx) return;
            
            const frequencies = [523.25, 587.33, 659.25, 783.99]; // C5, D5, E5, G5
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequencies[lane], audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }


        // Game state variables
        let bestScore = localStorage.getItem('neonBeatBest') || 0;
        bestScoreEl.textContent = bestScore;

        let gameState = 'START';
        let score = 0;
        let combo = 0;

        let notes = [];
        let particles = [];
        let laneFlashes = [0, 0, 0, 0];
        let laneKeys = ['D', 'F', 'J', 'K'];
        let stars = [];

        // Generate stars background
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height * 0.45,
                r: Math.random() * 1.5 + 0.1,
                alpha: Math.random() * 0.5 + 0.1
            });
        }

        // 3D Perspective runway mapping helper
        // We project a normalized 3D perspective path
        // yRatio goes from 0 (spawn, top of runway) to 1.0 (hit line, bottom)
        const RUNWAY_TOP_Y = 80;
        const RUNWAY_BOT_Y = 430;
        const CENTER_X = canvas.width / 2;

        function getPerspectiveCoords(laneIndex, yRatio) {
            // yRatio^2 provides the linear perspective acceleration
            const projY = RUNWAY_TOP_Y + (RUNWAY_BOT_Y - RUNWAY_TOP_Y) * (yRatio * yRatio);
            
            // Width of runway expands down
            const topWidth = 15; // lane width at top
            const botWidth = 80; // lane width at bottom
            const currentLaneWidth = topWidth + (botWidth - topWidth) * yRatio;

            // X offset relative to center
            // laneIndex ranges 0 to 3
            // offsets: -1.5, -0.5, 0.5, 1.5
            const laneOffset = (laneIndex - 1.5) * currentLaneWidth;
            const projX = CENTER_X + laneOffset;

            return { x: projX, y: projY, width: currentLaneWidth };
        }

        // Scheduling engine: Schedules audio beats and senkronize notes
        function scheduleNextBeat() {
            // Bassline pattern: rolling octave A-minor -> G -> F -> E
            const bassAm = [55.0, 55.0, 110.0, 55.0]; // A1, A2
            const bassG = [49.0, 49.0, 98.0, 49.0];  // G1, G2
            const bassF = [43.65, 43.65, 87.3, 43.65]; // F1, F2
            const bassE = [41.2, 41.2, 82.4, 41.2];  // E1, E2
            
            // Determine active chord index
            const chordIndex = Math.floor(beatCounter / 16) % 4; // 16 beats per chord
            let activeBass = bassAm;
            if (chordIndex === 1) activeBass = bassG;
            else if (chordIndex === 2) activeBass = bassF;
            else if (chordIndex === 3) activeBass = bassE;

            // Schedule audio nodes
            // Hi-hat scheduled on eighth notes
            playHiHat(nextNoteTime);
            playHiHat(nextNoteTime + BEAT_INTERVAL / 2);

            // Rolling Synth Bass Pluck
            const bassFreq = activeBass[beatCounter % 4];
            playBassPluck(bassFreq, nextNoteTime);
            playBassPluck(bassFreq * 1.5, nextNoteTime + BEAT_INTERVAL / 2);

            // Drum rhythms schedule
            const beatInBar = beatCounter % 4; // 0, 1, 2, 3
            
            // Kick scheduled on 1, 2, 3, 4
            playKick(nextNoteTime);

            // Snare scheduled on 2 and 4 (beat index 1 and 3)
            if (beatInBar === 1 || beatInBar === 3) {
                playSnare(nextNoteTime);
            }

            // Note spawning senkronizasyon
            // We schedule notes to reach the hit line exactly at `nextNoteTime`
            // Lane selection pattern
            const lanesToSpawn = getRhythmSpawnLanes(beatCounter);
            lanesToSpawn.forEach(lane => {
                notes.push({
                    lane: lane,
                    targetTime: nextNoteTime,
                    hit: false,
                    missed: false
                });
            });

            // Advance timing clock
            beatCounter++;
            nextNoteTime += BEAT_INTERVAL;
        }

        // Rhythmic pattern engine: decides note spawn positions
        function getRhythmSpawnLanes(beatIdx) {
            // Return array of lane indices [0, 1, 2, 3] to spawn notes
            // Avoid overly dense spawning to maintain smooth rhythm
            const barIndex = Math.floor(beatIdx / 4);
            const beatInBar = beatIdx % 4;

            // Introduction phase (first 4 bars): simple notes
            if (barIndex < 2) {
                if (beatInBar === 0) return [Math.floor(Math.random() * 4)];
                if (beatInBar === 2) return [Math.floor(Math.random() * 4)];
                return [];
            }

            // Standard rhythms
            const lane1 = Math.floor(Math.sin(beatIdx * 0.8) * 2 + 2);
            
            if (beatInBar === 0) {
                return [lane1];
            }
            if (beatInBar === 2) {
                return [(lane1 + 2) % 4];
            }
            
            // Double notes on 8th beat increments occasionally
            if (beatIdx % 8 === 4 && Math.random() < 0.4) {
                return [0, 3]; // Outer lane doubles
            }
            if (beatIdx % 8 === 6 && Math.random() < 0.3) {
                return [1, 2]; // Inner lane doubles
            }

            // Occasional syncopations
            if (beatInBar === 1 && Math.random() < 0.2) {
                return [Math.floor(Math.random() * 4)];
            }

            return [];
        }

        // Audio clock scheduler loop
        function scheduleLoop() {
            if (gameState !== 'PLAYING') return;

            // Schedule events up to 100ms in advance
            const scheduleAheadTime = 0.15;
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNextBeat();
            }
        }

        // Spark particles generator
        function spawnHitParticles(x, y, hue) {
            const count = 12;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4.5 + 2.0;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    hue: hue,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.03,
                    size: Math.random() * 3 + 1.5
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${p.life})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${p.hue}, 95%, 60%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // Player input hit checks
        function handleLaneHit(laneIndex) {
            if (gameState !== 'PLAYING') return;

            // Flash lane visual padding
            laneFlashes[laneIndex] = 1.0;

            const curTime = audioCtx.currentTime;

            // Find closest unhit note in this specific lane
            const candidates = notes.filter(n => n.lane === laneIndex && !n.hit && !n.missed);
            if (candidates.length === 0) return;

            // Find the closest one
            candidates.sort((a, b) => Math.abs(a.targetTime - curTime) - Math.abs(b.targetTime - curTime));
            const note = candidates[0];

            const delta = Math.abs(note.targetTime - curTime);

            if (delta <= GOOD_WINDOW) {
                // It's a valid hit!
                note.hit = true;
                playHitSynth(laneIndex);

                // Find screen coordinates of hit for particles
                const coords = getPerspectiveCoords(laneIndex, 1.0);
                const colors = [340, 200, 45, 120]; // Pink, Teal, Gold, Green
                spawnHitParticles(coords.x, coords.y, colors[laneIndex]);

                // Determine feedback timing rating
                if (delta <= PERFECT_WINDOW) {
                    combo++;
                    score += 50 + Math.floor(combo * 1.2);
                    triggerFeedback('KUSURSUZ!', 'perfect');
                } else if (delta <= GREAT_WINDOW) {
                    combo++;
                    score += 35 + Math.floor(combo * 0.8);
                    triggerFeedback('HARİKA!', 'great');
                } else {
                    combo++;
                    score += 20;
                    triggerFeedback('İYİ!', 'good');
                }

                // Update UI panels
                scoreEl.textContent = score;
                comboEl.textContent = combo;

                // Remove note immediately
                notes.splice(notes.indexOf(note), 1);
            }
        }

        function triggerFeedback(text, type) {
            feedbackText.textContent = text;
            
            feedbackText.className = 'feedback-text'; // Clear classes
            void feedbackText.offsetWidth; // Force Reflow
            
            feedbackText.classList.add(`feedback-${type}`, 'active');
            
            setTimeout(() => {
                feedbackText.classList.remove('active');
            }, 350);
        }

        // Draw parildayan real-time audio visualizers on left/right edges
        function drawEqualizerBars() {
            if (!analyserNode || freqData.length === 0) return;

            analyserNode.getByteFrequencyData(freqData);

            const barCount = 14;
            const barWidth = 6;
            const startY = 320;
            const spacing = 12;

            // Draw visualizer bars
            ctx.shadowBlur = 10;
            for (let i = 0; i < barCount; i++) {
                // Normalize frequency byte (0-255)
                const val = freqData[i] || 0;
                const ratio = val / 255;
                const barHeight = Math.max(4, ratio * 90);

                // Colors: linear cyan/pink shifts
                const hueLeft = (190 + i * 8) % 360;
                const hueRight = (320 + i * 8) % 360;

                ctx.shadowColor = `hsl(${hueLeft}, 95%, 60%)`;
                ctx.fillStyle = `hsla(${hueLeft}, 95%, 65%, 0.75)`;
                
                // Draw Left Side spectrum
                ctx.beginPath();
                ctx.roundRect(16, startY - i * spacing - barHeight/2, barHeight, barWidth, 3);
                ctx.fill();

                // Draw Right Side spectrum
                ctx.shadowColor = `hsl(${hueRight}, 95%, 60%)`;
                ctx.fillStyle = `hsla(${hueRight}, 95%, 65%, 0.75)`;
                
                ctx.beginPath();
                ctx.roundRect(canvas.width - 16 - barHeight, startY - i * spacing - barHeight/2, barHeight, barWidth, 3);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // Draw 3D Perspective Runway Grid & Lanes
        function drawRunway() {
            // Neon Sunset sun visual helper at top
            const gradSun = ctx.createRadialGradient(CENTER_X, RUNWAY_TOP_Y - 10, 5, CENTER_X, RUNWAY_TOP_Y - 10, 45);
            gradSun.addColorStop(0, 'rgba(255, 0, 127, 0.4)');
            gradSun.addColorStop(1, 'rgba(255, 242, 254, 0.0)');
            ctx.fillStyle = gradSun;
            ctx.beginPath();
            ctx.arc(CENTER_X, RUNWAY_TOP_Y - 10, 45, 0, Math.PI * 2);
            ctx.fill();

            // Lanes horizontal line division grids
            ctx.lineWidth = 1.5;
            
            // Draw 4 lanes borders
            const colors = ['#ff007f', '#00f2fe', '#ffd700', '#00ffcc'];

            for (let i = 0; i <= 4; i++) {
                const pTop = getPerspectiveCoords(i, 0.0);
                const pBot = getPerspectiveCoords(i, 1.0);
                
                // Border light glowing paths
                ctx.shadowBlur = 8;
                ctx.shadowColor = colors[Math.min(i, 3)];
                ctx.strokeStyle = `rgba(255, 255, 255, 0.25)`;
                ctx.beginPath();
                ctx.moveTo(pTop.x, pTop.y);
                ctx.lineTo(pBot.x, pBot.y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Draw horizontal rhythmic grid lines flowing down the runway
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            const lineGridCount = 10;
            // flow offset based on audio context time to make grid feel like it's moving
            const flowOffset = (audioCtx ? audioCtx.currentTime * 1.5 : 0) % 1.0;
            
            for (let j = 0; j < lineGridCount; j++) {
                const ratio = ((j - flowOffset) / (lineGridCount - 1));
                if (ratio >= 0 && ratio <= 1.0) {
                    const pLeft = getPerspectiveCoords(0, ratio);
                    const pRight = getPerspectiveCoords(4, ratio);
                    ctx.beginPath();
                    ctx.moveTo(pLeft.x, pLeft.y);
                    ctx.lineTo(pRight.x, pRight.y);
                    ctx.stroke();
                }
            }

            // Draw Lane key highlights (Lane pad plates at bottom)
            const laneColors = [
                'rgba(255, 0, 127, 0.1)',
                'rgba(0, 242, 254, 0.1)',
                'rgba(255, 215, 0, 0.1)',
                'rgba(0, 255, 204, 0.1)'
            ];
            
            for (let l = 0; l < 4; l++) {
                const pL = getPerspectiveCoords(l, 1.0);
                const pR = getPerspectiveCoords(l + 1, 1.0);
                const pT = getPerspectiveCoords(l + 0.5, 0.96);

                // Draw solid glowing hit pads
                ctx.fillStyle = laneColors[l];
                if (laneFlashes[l] > 0.0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${laneFlashes[l] * 0.35})`;
                }
                
                ctx.beginPath();
                ctx.moveTo(pL.x, pL.y);
                ctx.lineTo(pR.x, pR.y);
                ctx.lineTo(CENTER_X + (l + 0.5 - 2) * pT.width, pT.y);
                ctx.lineTo(CENTER_X + (l - 0.5 - 2) * pT.width, pT.y);
                ctx.closePath();
                ctx.fill();

                // Key buttons labels (D - F - J - K)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '800 12px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText(laneKeys[l], pL.x + (pR.x - pL.x)/2, pL.y + 18);
            }

            // Draw master Vuruş Çizgisi (Hit Line)
            const pStart = getPerspectiveCoords(0, 1.0);
            const pEnd = getPerspectiveCoords(4, 1.0);

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3.5;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f2fe';
            ctx.beginPath();
            ctx.moveTo(pStart.x, pStart.y);
            ctx.lineTo(pEnd.x, pEnd.y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // Draw note blocks
        function drawNotes() {
            if (!audioCtx) return;

            const curTime = audioCtx.currentTime;
            
            const laneColors = [
                '#ff007f', // Pink
                '#00f2fe', // Teal
                '#ffd700', // Gold
                '#00ffcc'  // Green
            ];

            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                
                // Calculate note travel ratio
                // ratio goes 0 (spawn at top) to 1.0 (reaches hit line)
                const timeRemaining = n.targetTime - curTime;
                const ratio = 1.0 - (timeRemaining / NOTE_TRAVEL_TIME);

                // Handle Missed Note logic
                if (ratio > 1.15) {
                    if (!n.missed) {
                        n.missed = true;
                        combo = 0; // Reset combo
                        comboEl.textContent = combo;
                        triggerFeedback('ISKALADI!', 'miss');
                    }
                    notes.splice(i, 1);
                    continue;
                }

                if (ratio >= 0) {
                    const coords = getPerspectiveCoords(n.lane, ratio);
                    
                    // Draw neon perspective note bar
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = laneColors[n.lane];
                    ctx.fillStyle = '#ffffff'; // Solid white core for bright glow
                    
                    const barHeight = 10 * ratio; // Expands as it gets closer
                    const barWidth = coords.width * 0.85;

                    ctx.beginPath();
                    ctx.roundRect(coords.x - barWidth/2, coords.y - barHeight/2, barWidth, barHeight, 4);
                    ctx.fill();
                    
                    ctx.strokeStyle = laneColors[n.lane];
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    
                    ctx.shadowBlur = 0;
                }
            }
        }

        // Main game rendering loop
        function draw() {
            // Clear screen
            ctx.fillStyle = '#040112';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw cosmic stars background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // 1. Draw 3D runway
            drawRunway();

            // 2. Draw active notes sliding down
            drawNotes();

            // 3. Draw visualizers
            drawEqualizerBars();

            // 4. Update elements
            updateAndDrawParticles();
        }

        // Game update loop
        function update() {
            if (gameState !== 'PLAYING') return;

            // Schedule audio nodes
            scheduleLoop();

            // Decay lane keyboard flashes
            for (let l = 0; l < 4; l++) {
                if (laneFlashes[l] > 0) {
                    laneFlashes[l] -= 0.08;
                }
            }
        }

        // 60FPS animation frames loop
        function tick() {
            update();
            draw();
            requestAnimationFrame(tick);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            
            if (schedulerInterval) {
                clearInterval(schedulerInterval);
                schedulerInterval = null;
            }

            // High Score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neonBeatBest', bestScore);
                bestScoreEl.textContent = bestScore;
            }

            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('active');
        }

        function resetGame() {
            score = 0;
            combo = 0;
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            notes = [];
            particles = [];
            laneFlashes = [0, 0, 0, 0];

            gameOverScreen.classList.remove('active');
            startScreen.classList.remove('active');

            gameState = 'PLAYING';
            
            // Set timing clocks
            nextNoteTime = audioCtx.currentTime + 1.0; // Let's give player a 1-second breathing room
            beatCounter = 0;

            // Start audio scheduler loop interval
            if (schedulerInterval) clearInterval(schedulerInterval);
            schedulerInterval = setInterval(scheduleLoop, 25);
        }

        // Inputs & Event Bindings
        const keyCodes = {
            'd': 0, 'D': 0,
            'f': 1, 'F': 1,
            'j': 2, 'J': 2,
            'k': 3, 'K': 3
        };

        window.addEventListener('keydown', (e) => {
            if (gameState === 'PLAYING') {
                const lane = keyCodes[e.key];
                if (lane !== undefined) {
                    handleLaneHit(lane);
                    e.preventDefault();
                }
            }
        });

        // Mobile touch controls mapping: split canvas into 4 vertical sections
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState !== 'PLAYING') return;

            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            
            // Determine touch section (4 columns)
            const colWidth = rect.width / 4;
            const laneIndex = Math.min(3, Math.floor(touchX / colWidth));
            
            handleLaneHit(laneIndex);
        }, { passive: false });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });

        // Initial render frame
        draw();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
