<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Hokey // Cyber Air Hockey</title>
    <!-- Google Fonts for modern tech typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03001e;
            --primary-glow: #00f2fe; /* Cyber Cyan */
            --secondary-glow: #ff007f; /* Neon Pink */
            --accent-glow: #ffd700; /* Neon Gold */
            --glass-bg: rgba(8, 4, 25, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0f0426 0%, var(--bg-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            touch-action: none;
        }

        .wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 20px 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        inset 0 0 20px rgba(0, 242, 254, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            width: min(95vw, 450px);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2.5px;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: -4px;
        }

        .stats-panel {
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            justify-content: space-between;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            transition: transform 0.1s ease;
        }

        .score-player .stat-value {
            color: var(--primary-glow);
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
        }

        .score-ai .stat-value {
            color: var(--secondary-glow);
            text-shadow: 0 0 12px rgba(ff, 0, 127, 0.5);
        }

        .difficulty-box .stat-value {
            color: var(--accent-glow);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            font-size: 1.2rem;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .canvas-container {
            position: relative;
            padding: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
            width: 100%;
            overflow: hidden;
            aspect-ratio: 2/3;
        }

        canvas {
            display: block;
            border-radius: 15px;
            background: #02010c;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        .screen-overlay {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: rgba(5, 2, 20, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 20px;
        }

        .screen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .screen-overlay h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-glow);
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .screen-overlay p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            line-height: 1.5;
            max-width: 90%;
        }

        .screen-overlay p span {
            font-weight: 800;
            color: var(--accent-glow);
        }

        .difficulty-selectors {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 320px;
        }

        .diff-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 4px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: 600;
        }

        .diff-btn.selected {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--primary-glow);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.15), rgba(ff, 0, 127, 0.15));
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.3), rgba(ff, 0, 127, 0.3));
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.3);
            border-color: var(--primary-glow);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .ctrl-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .ctrl-btn-primary {
            border-color: rgba(0, 242, 254, 0.4);
            color: var(--primary-glow);
        }

        .ctrl-btn-primary:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        /* Screen Shake effect on Goal */
        .shake {
            animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .goal-flash {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: #ffffff;
            border-radius: 15px;
            opacity: 0;
            pointer-events: none;
            z-index: 9;
            transition: opacity 0.05s ease-out;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 16px;
                border-radius: 20px;
                gap: 12px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .stat-value {
                font-size: 1.3rem;
            }
            .screen-overlay h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="gameWrapper">
        <h1>Siber Hokey</h1>
        
        <div class="stats-panel">
            <div class="stat-box score-player">
                <span class="stat-label">SEN</span>
                <span class="stat-value" id="scorePlayer">0</span>
            </div>
            <div class="stat-box difficulty-box">
                <span class="stat-label">ZORLUK</span>
                <span class="stat-value" id="activeDiff">ORTA</span>
            </div>
            <div class="stat-box score-ai">
                <span class="stat-label">YAPAY ZEKA</span>
                <span class="stat-value" id="scoreAi">0</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div class="goal-flash" id="goalFlash"></div>
            
            <!-- Start Screen Overlay -->
            <div class="screen-overlay active" id="startScreen">
                <h2>Cyber Air Hockey</h2>
                <p>Hızlı refleksler, taktiksel vuruşlar! Diski karşı kaleye sokarak skor kazanın. <span>7 sayıya</span> ulaşan kazanır.</p>
                
                <span class="stat-label" style="margin-bottom: 8px;">Zorluk Seçin</span>
                <div class="difficulty-selectors">
                    <button class="diff-btn" onclick="selectDifficulty('easy')">KOLAY</button>
                    <button class="diff-btn selected" onclick="selectDifficulty('medium')">ORTA</button>
                    <button class="diff-btn" onclick="selectDifficulty('hard')">ZOR</button>
                    <button class="diff-btn" onclick="selectDifficulty('cyber')">SİBER</button>
                </div>
                
                <button class="btn" id="startBtn">Mücadeleye Katıl</button>
            </div>

            <!-- Game Over Screen Overlay -->
            <div class="screen-overlay" id="gameOverScreen">
                <h2 id="winnerText">ZAFER SENİN!</h2>
                <p>Ulaşılan Son Skor: <span id="finalScore">7 - 3</span></p>
                <button class="btn" id="restartBtn">Tekrar Oyna</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn ctrl-btn-primary" id="playPauseBtn">Başla</button>
            <button class="ctrl-btn" id="resetBtn">Sıfırla</button>
        </div>

        <div class="hint">Alt yarı sahadaki diski mouse veya dokunmatik ekranla kaydırarak vur.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scorePlayerEl = document.getElementById('scorePlayer');
        const scoreAiEl = document.getElementById('scoreAi');
        const activeDiffEl = document.getElementById('activeDiff');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const gameWrapper = document.getElementById('gameWrapper');
        const goalFlash = document.getElementById('goalFlash');
        const winnerText = document.getElementById('winnerText');
        const finalScore = document.getElementById('finalScore');

        // Virtual Field Resolution: 400x600
        const FIELD_WIDTH = 400;
        const FIELD_HEIGHT = 600;
        const GOAL_WIDTH = 145;
        const GOAL_START = (FIELD_WIDTH - GOAL_WIDTH) / 2; // 127.5
        const GOAL_END = GOAL_START + GOAL_WIDTH;          // 272.5

        // Physics constants
        const FRICTION = 0.99;
        const MAX_PUCK_SPEED = 24;
        const BOUNCE_ELASTICITY = 0.98;

        // Difficulty profiles
        const DIFFICULTY_PROFILES = {
            easy: { name: 'KOLAY', speed: 3.2, delay: 0.15, mistakeRate: 0.22, color: '#00ffcc' },
            medium: { name: 'ORTA', speed: 6.0, delay: 0.08, mistakeRate: 0.12, color: '#ffea00' },
            hard: { name: 'ZOR', speed: 9.5, delay: 0.04, mistakeRate: 0.05, color: '#ff5500' },
            cyber: { name: 'SİBER', speed: 15.0, delay: 0.0, mistakeRate: 0.01, color: '#ff00ff' }
        };

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let selectedDiff = 'medium';
        let scorePlayer = 0;
        let scoreAi = 0;
        
        // Game objects
        let puck = { x: 200, y: 300, vx: 0, vy: 0, r: 14 };
        let player = { x: 200, y: 500, vx: 0, vy: 0, r: 24, active: false };
        let ai = { x: 200, y: 100, vx: 0, vy: 0, r: 24 };

        // Interaction state
        let pointer = { x: 200, y: 500, down: false };
        let particles = [];
        let scoreAnnouncementText = '';
        let scoreAnnouncementAlpha = 0;
        let scoreAnnouncementColor = '#fff';

        // Sound synthesizer (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSynthSound(freqStart, freqEnd, duration, type = 'sine', volume = 0.2) {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
                if (freqEnd !== freqStart) {
                    osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
                }

                gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio Synthesis Error: ", e);
            }
        }

        function triggerWallBounceSound() {
            playSynthSound(160, 80, 0.08, 'sine', 0.15);
        }

        function triggerPaddleHitSound(isAi = false) {
            playSynthSound(isAi ? 360 : 440, 200, 0.1, 'triangle', 0.25);
        }

        function triggerGoalSound(isPlayerScore = true) {
            const time = audioCtx ? audioCtx.currentTime : 0;
            if (isPlayerScore) {
                // Happy major chord notes C5 -> E5 -> G5 -> C6
                setTimeout(() => playSynthSound(523.25, 523.25, 0.1, 'sine', 0.2), 0);
                setTimeout(() => playSynthSound(659.25, 659.25, 0.1, 'sine', 0.2), 80);
                setTimeout(() => playSynthSound(783.99, 783.99, 0.1, 'sine', 0.2), 160);
                setTimeout(() => playSynthSound(1046.50, 1046.50, 0.2, 'triangle', 0.2), 240);
            } else {
                // Sad dissonant descending sweep
                setTimeout(() => playSynthSound(370.0, 311.1, 0.12, 'sawtooth', 0.18), 0);
                setTimeout(() => playSynthSound(311.1, 261.6, 0.12, 'sawtooth', 0.18), 100);
                setTimeout(() => playSynthSound(261.6, 196.0, 0.25, 'sawtooth', 0.18), 200);
            }
        }

        // Particle Class
        class Particle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.alpha = 1.0;
                this.decay = 1.0 / life; // decrease alpha over life frames
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createSparkExplosion(x, y, color, count = 15, speedMultiplier = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 5 + 2) * speedMultiplier;
                const size = Math.random() * 3 + 1.5;
                const life = Math.random() * 20 + 20; // 20-40 frames
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    size,
                    life
                ));
            }
        }

        // Setup difficulty buttons
        window.selectDifficulty = function(diffKey) {
            selectedDiff = diffKey;
            
            // Highlight button
            const buttons = document.querySelectorAll('.difficulty-selectors .diff-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(diffKey)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
            
            activeDiffEl.textContent = DIFFICULTY_PROFILES[diffKey].name;
            activeDiffEl.style.color = DIFFICULTY_PROFILES[diffKey].color;
            activeDiffEl.style.textShadow = `0 0 12px ${DIFFICULTY_PROFILES[diffKey].color}`;
        };

        // Reset positions for new round
        function resetPositions(servingDirection = 1) {
            puck.x = 200;
            puck.y = servingDirection > 0 ? 400 : 200;
            puck.vx = 0;
            puck.vy = 0;
            
            player.x = 200;
            player.y = 500;
            player.vx = 0;
            player.vy = 0;
            
            ai.x = 200;
            ai.y = 100;
            ai.vx = 0;
            ai.vy = 0;
            
            pointer.x = 200;
            pointer.y = 500;
        }

        // Screen Shake
        function triggerScreenShake() {
            gameWrapper.classList.add('shake');
            setTimeout(() => {
                gameWrapper.classList.remove('shake');
            }, 250);
        }

        function triggerFlash() {
            goalFlash.style.opacity = '0.9';
            setTimeout(() => {
                goalFlash.style.opacity = '0';
            }, 100);
        }

        // Goal scored handler
        function scoreGoal(scorer) {
            triggerScreenShake();
            triggerFlash();
            
            if (scorer === 'player') {
                scorePlayer++;
                scorePlayerEl.textContent = scorePlayer;
                triggerGoalSound(true);
                createSparkExplosion(puck.x, puck.y, '#00f2fe', 40, 2.5);
                
                scoreAnnouncementText = 'GOL!';
                scoreAnnouncementColor = '#00f2fe';
                scoreAnnouncementAlpha = 1.0;
                
                if (scorePlayer >= 7) {
                    endGame('player');
                } else {
                    resetPositions(-1); // Serve to AI
                }
            } else {
                scoreAi++;
                scoreAiEl.textContent = scoreAi;
                triggerGoalSound(false);
                createSparkExplosion(puck.x, puck.y, '#ff007f', 40, 2.5);
                
                scoreAnnouncementText = 'YAPAY ZEKA SAYI ALDI!';
                scoreAnnouncementColor = '#ff007f';
                scoreAnnouncementAlpha = 1.0;
                
                if (scoreAi >= 7) {
                    endGame('ai');
                } else {
                    resetPositions(1); // Serve to player
                }
            }
        }

        // Game over screen trigger
        function endGame(winner) {
            gameState = 'GAMEOVER';
            
            if (winner === 'player') {
                winnerText.textContent = 'ZAFER SENİN!';
                winnerText.style.color = 'var(--primary-glow)';
                winnerText.style.textShadow = '0 0 25px rgba(0, 242, 254, 0.7)';
            } else {
                winnerText.textContent = 'BOZGUN!';
                winnerText.style.color = 'var(--secondary-glow)';
                winnerText.style.textShadow = '0 0 25px rgba(255, 0, 127, 0.7)';
            }
            
            finalScore.textContent = `${scorePlayer} - ${scoreAi}`;
            gameOverScreen.classList.add('active');
            playPauseBtn.textContent = 'Başla';
        }

        // Reset the score and start fresh
        function resetGame() {
            scorePlayer = 0;
            scoreAi = 0;
            scorePlayerEl.textContent = '0';
            scoreAiEl.textContent = '0';
            resetPositions(1);
            particles = [];
            scoreAnnouncementAlpha = 0;
        }

        // Physics Engine updates
        function updatePhysics() {
            // 1. Move Player Mallet smoothly with pointer
            const prevPlayerX = player.x;
            const prevPlayerY = player.y;
            
            // Limit target to player's territory (bottom half)
            let targetX = Math.max(player.r, Math.min(FIELD_WIDTH - player.r, pointer.x));
            // Player y-confinement: between mid-court line (300) and bottom wall
            let targetY = Math.max(300 + player.r, Math.min(FIELD_HEIGHT - player.r, pointer.y));
            
            player.x = targetX;
            player.y = targetY;
            
            // Calculate player velocity for impact transfer
            player.vx = player.x - prevPlayerX;
            player.vy = player.y - prevPlayerY;

            // 2. Adaptive AI Movement Logic
            updateAI();

            // 3. Move Puck
            puck.x += puck.vx;
            puck.y += puck.vy;
            
            // Apply air friction/damping
            puck.vx *= FRICTION;
            puck.vy *= FRICTION;
            
            // Limit max speed to prevent physics glitching (tunneling)
            let puckSpeed = Math.hypot(puck.vx, puck.vy);
            if (puckSpeed > MAX_PUCK_SPEED) {
                puck.vx = (puck.vx / puckSpeed) * MAX_PUCK_SPEED;
                puck.vy = (puck.vy / puckSpeed) * MAX_PUCK_SPEED;
            }

            // 4. Puck Collisions with outer borders
            // Left boundary
            if (puck.x - puck.r < 0) {
                puck.x = puck.r;
                puck.vx = -puck.vx * BOUNCE_ELASTICITY;
                triggerWallBounceSound();
                createSparkExplosion(0, puck.y, '#00f2fe', 6);
            }
            // Right boundary
            else if (puck.x + puck.r > FIELD_WIDTH) {
                puck.x = FIELD_WIDTH - puck.r;
                puck.vx = -puck.vx * BOUNCE_ELASTICITY;
                triggerWallBounceSound();
                createSparkExplosion(FIELD_WIDTH, puck.y, '#ff007f', 6);
            }

            // Top boundary (incorporating AI Goal opening)
            if (puck.y - puck.r < 0) {
                // Check if it is completely inside goal posts
                if (puck.x > GOAL_START && puck.x < GOAL_END) {
                    if (puck.y < -puck.r) {
                        scoreGoal('player');
                    }
                } else {
                    // Hits top wall
                    puck.y = puck.r;
                    puck.vy = -puck.vy * BOUNCE_ELASTICITY;
                    triggerWallBounceSound();
                    createSparkExplosion(puck.x, 0, '#ffffff', 6);
                }
            }

            // Bottom boundary (incorporating Player Goal opening)
            if (puck.y + puck.r > FIELD_HEIGHT) {
                // Check if it is completely inside goal posts
                if (puck.x > GOAL_START && puck.x < GOAL_END) {
                    if (puck.y > FIELD_HEIGHT + puck.r) {
                        scoreGoal('ai');
                    }
                } else {
                    // Hits bottom wall
                    puck.y = FIELD_HEIGHT - puck.r;
                    puck.vy = -puck.vy * BOUNCE_ELASTICITY;
                    triggerWallBounceSound();
                    createSparkExplosion(puck.x, FIELD_HEIGHT, '#ffffff', 6);
                }
            }

            // 5. Goal Post Corners Physics (130, 0), (270, 0), (130, 600), (270, 600)
            // Collide with post points to make nice corner bounces
            const posts = [
                {x: GOAL_START, y: 0}, {x: GOAL_END, y: 0},
                {x: GOAL_START, y: FIELD_HEIGHT}, {x: GOAL_END, y: FIELD_HEIGHT}
            ];
            
            for (let post of posts) {
                let dist = Math.hypot(puck.x - post.x, puck.y - post.y);
                if (dist < puck.r) {
                    let nx = (puck.x - post.x) / dist;
                    let ny = (puck.y - post.y) / dist;
                    // Push out
                    puck.x = post.x + nx * puck.r;
                    puck.y = post.y + ny * puck.r;
                    
                    // Bounce reflect velocity
                    let dotProduct = puck.vx * nx + puck.vy * ny;
                    if (dotProduct < 0) {
                        puck.vx = (puck.vx - 2 * dotProduct * nx) * BOUNCE_ELASTICITY;
                        puck.vy = (puck.vy - 2 * dotProduct * ny) * BOUNCE_ELASTICITY;
                        triggerWallBounceSound();
                        createSparkExplosion(post.x, post.y, '#ffd700', 10);
                    }
                }
            }

            // 6. Mallet-Puck circle-circle elastic collision resolution
            resolveMalletCollision(player, false);
            resolveMalletCollision(ai, true);

            // 7. Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 8. Update goal scoring announcement overlay fades
            if (scoreAnnouncementAlpha > 0) {
                scoreAnnouncementAlpha -= 0.015;
            }
        }

        // Rigid body circular collision resolution
        function resolveMalletCollision(mallet, isAi) {
            let dist = Math.hypot(puck.x - mallet.x, puck.y - mallet.y);
            let minDist = puck.r + mallet.r;

            if (dist < minDist) {
                let nx = (puck.x - mallet.x) / dist;
                let ny = (puck.y - mallet.y) / dist;

                // Push puck completely out of mallet
                let overlap = minDist - dist;
                puck.x += nx * overlap;
                puck.y += ny * overlap;

                // Correct positions if pushed out of fields bounds immediately
                if (puck.x - puck.r < 0) puck.x = puck.r;
                if (puck.x + puck.r > FIELD_WIDTH) puck.x = FIELD_WIDTH - puck.r;
                if (puck.y - puck.r < 0 && (puck.x <= GOAL_START || puck.x >= GOAL_END)) puck.y = puck.r;
                if (puck.y + puck.r > FIELD_HEIGHT && (puck.x <= GOAL_START || puck.x >= GOAL_END)) puck.y = FIELD_HEIGHT - puck.r;

                // Elastic collision velocity equations
                let rvx = puck.vx - mallet.vx;
                let rvy = puck.vy - mallet.vy;
                let velAlongNormal = rvx * nx + rvy * ny;

                // Check if objects are moving towards each other
                if (velAlongNormal < 0) {
                    let restitution = 1.0;
                    // Treat user mallet as infinite mass during collision to provide reliable hit power
                    let impulse = -(1 + restitution) * velAlongNormal;
                    
                    puck.vx += impulse * nx;
                    puck.vy += impulse * ny;

                    // Add dynamic mallet speed overlay to give user a heavy swing feel
                    puck.vx += mallet.vx * 0.45;
                    puck.vy += mallet.vy * 0.45;
                    
                    triggerPaddleHitSound(isAi);
                    createSparkExplosion(puck.x - nx * puck.r, puck.y - ny * puck.r, isAi ? '#ff007f' : '#00f2fe', 16, 1.2);
                }
            }
        }

        // Smart Adaptive AI movement algorithms
        function updateAI() {
            const profile = DIFFICULTY_PROFILES[selectedDiff];
            const maxSpeed = profile.speed;

            // Target positions
            let targetX = 200;
            let targetY = 100; // AI home defense center

            // Track puck when in AI's territory (top half) or traveling to it
            if (puck.y < 300 || puck.vy < 0) {
                // If puck is on AI half, track it actively
                targetX = puck.x;
                
                // Add slight delay-based offset behavior for lower difficulties
                if (Math.random() < profile.mistakeRate) {
                    targetX += (Math.random() - 0.5) * 60; // AI miscalculates puck placement
                }

                // If puck is close enough, smash/strike it
                if (puck.y < 280) {
                    targetY = puck.y - 10;
                } else {
                    targetY = 160; // Keep slightly forward
                }
            } else {
                // Puck is in player half, return to home guard position
                // Block the center goal line depending on puck's alignment
                targetX = 200 + (puck.x - 200) * 0.4;
                targetY = 80;
            }

            // Confine AI target inside top boundaries
            targetX = Math.max(ai.r, Math.min(FIELD_WIDTH - ai.r, targetX));
            targetY = Math.max(ai.r, Math.min(300 - ai.r, targetY));

            // Smooth linear interpolation (lerp) toward target
            let dx = targetX - ai.x;
            let dy = targetY - ai.y;
            let dist = Math.hypot(dx, dy);

            // Cap AI mallet move speed per frame
            if (dist > maxSpeed) {
                ai.vx = (dx / dist) * maxSpeed;
                ai.vy = (dy / dist) * maxSpeed;
            } else {
                ai.vx = dx;
                ai.vy = dy;
            }

            ai.x += ai.vx;
            ai.y += ai.vy;
        }

        // Render Field, entities and visuals on Canvas
        function drawField() {
            // Dark glowing overlay background
            ctx.fillStyle = '#02010c';
            ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);

            // Background cyber grid lines (isometric synthwave style)
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.03)';
            ctx.lineWidth = 1.5;
            const gridSpacing = 40;
            
            // Vertical grids
            for (let x = 0; x < FIELD_WIDTH; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, FIELD_HEIGHT);
                ctx.stroke();
            }
            // Horizontal grids
            for (let y = 0; y < FIELD_HEIGHT; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(FIELD_WIDTH, y);
                ctx.stroke();
            }

            // Outer board glow boundaries
            ctx.shadowBlur = 15;
            ctx.lineWidth = 4;

            // Player side boundaries (Cyan)
            ctx.shadowColor = 'var(--primary-glow)';
            ctx.strokeStyle = 'var(--primary-glow)';
            // Left bottom wall
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(0, FIELD_HEIGHT);
            ctx.lineTo(GOAL_START, FIELD_HEIGHT);
            ctx.stroke();
            
            // Right bottom wall
            ctx.beginPath();
            ctx.moveTo(FIELD_WIDTH, 300);
            ctx.lineTo(FIELD_WIDTH, FIELD_HEIGHT);
            ctx.lineTo(GOAL_END, FIELD_HEIGHT);
            ctx.stroke();

            // AI side boundaries (Pink)
            ctx.shadowColor = 'var(--secondary-glow)';
            ctx.strokeStyle = 'var(--secondary-glow)';
            // Left top wall
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(0, 0);
            ctx.lineTo(GOAL_START, 0);
            ctx.stroke();
            
            // Right top wall
            ctx.beginPath();
            ctx.moveTo(FIELD_WIDTH, 300);
            ctx.lineTo(FIELD_WIDTH, 0);
            ctx.lineTo(GOAL_END, 0);
            ctx.stroke();

            // Middle dividing line & Center circle
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.2)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;

            // Mid line
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(FIELD_WIDTH, 300);
            ctx.stroke();

            // Center circle
            ctx.beginPath();
            ctx.arc(200, 300, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            // Inner spot
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.arc(200, 300, 5, 0, Math.PI * 2);
            ctx.fill();

            // Draw Goals boxes (Visual openings)
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            // AI Goal box
            ctx.fillRect(GOAL_START, -8, GOAL_WIDTH, 8);
            // Player Goal box
            ctx.fillRect(GOAL_START, FIELD_HEIGHT, GOAL_WIDTH, 8);

            // Draw Goal posts arcs
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            
            // AI Posts
            ctx.beginPath();
            ctx.arc(GOAL_START, 0, 4, 0, Math.PI * 2);
            ctx.arc(GOAL_END, 0, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.stroke();

            // Player Posts
            ctx.beginPath();
            ctx.arc(GOAL_START, FIELD_HEIGHT, 4, 0, Math.PI * 2);
            ctx.arc(GOAL_END, FIELD_HEIGHT, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function drawEntities() {
            // 1. Draw Particles
            particles.forEach(p => p.draw());

            // 2. Draw AI Mallet (Neon Pink)
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'var(--secondary-glow)';
            ctx.fillStyle = 'var(--secondary-glow)';
            ctx.beginPath();
            ctx.arc(ai.x, ai.y, ai.r, 0, Math.PI * 2);
            ctx.fill();
            // Core highlight
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(ai.x - 3, ai.y - 3, ai.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 3. Draw Player Mallet (Neon Cyan)
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'var(--primary-glow)';
            ctx.fillStyle = 'var(--primary-glow)';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fill();
            // Core highlight
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(player.x - 3, player.y - 3, player.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 4. Draw Puck (Gold/White)
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = 'var(--accent-glow)';
            ctx.fillStyle = 'var(--accent-glow)';
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
            ctx.fill();
            // Core highlight
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(puck.x - 2, puck.y - 2, puck.r * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 5. Draw Goal Scored Text announcement
            if (scoreAnnouncementAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, scoreAnnouncementAlpha);
                ctx.font = "800 2.2rem 'Outfit'";
                ctx.fillStyle = scoreAnnouncementColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = scoreAnnouncementColor;
                ctx.textAlign = 'center';
                ctx.fillText(scoreAnnouncementText, 200, 300);
                ctx.restore();
            }
        }

        // Loop Runner
        function loop() {
            if (gameState === 'PLAYING') {
                updatePhysics();
            }
            
            drawField();
            drawEntities();
            
            requestAnimationFrame(loop);
        }

        // Input Handlers: Mouse and Touch mapping to virtual 400x600 coordinates
        function mapInputCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = FIELD_WIDTH / rect.width;
            const scaleY = FIELD_HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(x, y) {
            initAudio();
            const coords = mapInputCoords(x, y);
            
            // Check if player is clicking near player mallet
            const dist = Math.hypot(coords.x - player.x, coords.y - player.y);
            if (dist < player.r * 2.5 && coords.y > 300) {
                player.active = true;
                pointer.x = coords.x;
                pointer.y = coords.y;
            }
        }

        function handlePointerMove(x, y) {
            if (!player.active) return;
            const coords = mapInputCoords(x, y);
            pointer.x = coords.x;
            pointer.y = coords.y;
        }

        function handlePointerUp() {
            player.active = false;
        }

        // Mouse Listeners
        canvas.addEventListener('mousedown', (e) => {
            handlePointerDown(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
            handlePointerUp();
        });

        // Touch Listeners
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault(); // Stop scroll
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            handlePointerUp();
        });

        // Button Click handlers
        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.classList.remove('active');
            gameState = 'PLAYING';
            playPauseBtn.textContent = 'Duraklat';
            resetGame();
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            gameState = 'PLAYING';
            playPauseBtn.textContent = 'Duraklat';
            resetGame();
        });

        playPauseBtn.addEventListener('click', () => {
            initAudio();
            if (gameState === 'START') {
                startScreen.classList.remove('active');
                gameState = 'PLAYING';
                playPauseBtn.textContent = 'Duraklat';
            } else if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                playPauseBtn.textContent = 'Devam Et';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                playPauseBtn.textContent = 'Duraklat';
            } else if (gameState === 'GAMEOVER') {
                gameOverScreen.classList.remove('active');
                gameState = 'PLAYING';
                playPauseBtn.textContent = 'Duraklat';
                resetGame();
            }
        });

        resetBtn.addEventListener('click', () => {
            resetGame();
            if (gameState === 'GAMEOVER') {
                gameOverScreen.classList.remove('active');
                gameState = 'START';
                startScreen.classList.add('active');
                playPauseBtn.textContent = 'Başla';
            }
        });

        // Initial launch
        loop();
    </script>
</body>
