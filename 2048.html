<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon 2048</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(31, 40, 51, 0.6);
            --grid-bg: rgba(0, 0, 0, 0.4);
            --cell-bg: rgba(255, 255, 255, 0.05);
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-color: #c5c6c7;
            --border: rgba(102, 252, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1f2833 0%, var(--bg-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            touch-action: none; /* Prevent scrolling on mobile */
        }

        .game-wrapper {
            background: var(--container-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(102, 252, 241, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: min(95vw, 450px);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            background: linear-gradient(to right, var(--primary-color), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            letter-spacing: 2px;
            margin: 0;
        }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .score-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        .game-board-container {
            position: relative;
            background: var(--grid-bg);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .grid-background {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: var(--cell-bg);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .tiles-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            border-radius: 10px;
            transition: transform 0.15s ease-in-out;
            /* Width and height are calculated based on grid size in JS */
        }

        /* Tile Color Styles */
        .tile-2 { background: rgba(0, 229, 255, 0.1); border: 2px solid #00e5ff; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.2); font-size: 2.2rem; }
        .tile-4 { background: rgba(0, 191, 255, 0.15); border: 2px solid #00bfff; color: #00bfff; text-shadow: 0 0 10px #00bfff; box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.3); font-size: 2.2rem; }
        .tile-8 { background: rgba(255, 0, 255, 0.2); border: 2px solid #ff00ff; color: #ff00ff; text-shadow: 0 0 12px #ff00ff; box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.4); font-size: 2.2rem; }
        .tile-16 { background: rgba(213, 0, 249, 0.25); border: 2px solid #d500f9; color: #d500f9; text-shadow: 0 0 12px #d500f9; box-shadow: inset 0 0 20px rgba(213, 0, 249, 0.5); font-size: 2.2rem; }
        .tile-32 { background: rgba(255, 23, 68, 0.3); border: 2px solid #ff1744; color: #ff1744; text-shadow: 0 0 15px #ff1744; box-shadow: inset 0 0 25px rgba(255, 23, 68, 0.6); font-size: 2.2rem; }
        .tile-64 { background: rgba(255, 107, 0, 0.35); border: 2px solid #ff6b00; color: #ff6b00; text-shadow: 0 0 15px #ff6b00; box-shadow: inset 0 0 25px rgba(255, 107, 0, 0.7); font-size: 2.2rem; }
        .tile-128 { background: rgba(255, 235, 59, 0.4); border: 2px solid #ffeb3b; color: #ffeb3b; text-shadow: 0 0 18px #ffeb3b; box-shadow: inset 0 0 30px rgba(255, 235, 59, 0.8); font-size: 1.8rem; }
        .tile-256 { background: rgba(0, 230, 118, 0.45); border: 2px solid #00e676; color: #00e676; text-shadow: 0 0 18px #00e676; box-shadow: inset 0 0 30px rgba(0, 230, 118, 0.8); font-size: 1.8rem; }
        .tile-512 { background: rgba(29, 233, 182, 0.5); border: 2px solid #1de9b6; color: #1de9b6; text-shadow: 0 0 20px #1de9b6; box-shadow: inset 0 0 35px rgba(29, 233, 182, 0.9); font-size: 1.8rem; }
        .tile-1024 { background: rgba(118, 255, 3, 0.55); border: 2px solid #76ff03; color: #76ff03; text-shadow: 0 0 20px #76ff03; box-shadow: inset 0 0 35px rgba(118, 255, 3, 0.9); font-size: 1.5rem; }
        .tile-2048 { background: rgba(255, 255, 255, 0.6); border: 2px solid #ffffff; color: #ffffff; text-shadow: 0 0 25px #ffffff; box-shadow: 0 0 20px #ffffff, inset 0 0 40px #ffffff; font-size: 1.5rem; }
        .tile-super { background: rgba(255, 255, 255, 0.8); border: 3px solid #ffffff; color: #ffffff; text-shadow: 0 0 30px #ffffff; box-shadow: 0 0 30px #ffffff, inset 0 0 50px #ffffff; font-size: 1.2rem; }

        .tile-new {
            animation: appear 0.2s ease-in-out;
        }

        .tile-merged {
            animation: pop 0.15s ease-in-out;
        }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .btn {
            background: linear-gradient(45deg, rgba(102, 252, 241, 0.1), rgba(69, 162, 158, 0.2));
            border: 1px solid rgba(102, 252, 241, 0.4);
            color: var(--primary-color);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background: rgba(102, 252, 241, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
            border-color: var(--primary-color);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            z-index: 10;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            display: flex;
            opacity: 1;
        }

        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 25px rgba(102, 252, 241, 0.6);
            background: linear-gradient(to right, var(--primary-color), #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
        }

        .controls-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: -10px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 20px;
                border-radius: 15px;
            }
            h1 { font-size: 2.2rem; }
            .tile-2, .tile-4, .tile-8, .tile-16, .tile-32, .tile-64 { font-size: 1.8rem; }
            .tile-128, .tile-256, .tile-512 { font-size: 1.4rem; }
            .tile-1024, .tile-2048 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <h1>2048</h1>
            <div class="scores">
                <div class="score-box">
                    <span class="score-label">Skor</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">En Yüksek</span>
                    <span class="score-value" id="bestScore">0</span>
                </div>
            </div>
        </div>

        <div class="game-board-container" id="boardContainer">
            <div class="grid-background">
                <!-- 16 empty cells for background -->
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tiles-container" id="tilesContainer">
                <!-- Tiles will be injected here via JS -->
            </div>
        </div>

        <div class="controls-hint">Kaydırarak (Mobil) veya Yön Tuşlarıyla (PC) Oynayın</div>
        <button class="btn" id="restartBtn">Yeniden Başlat</button>

        <div class="overlay" id="gameOverOverlay">
            <h2>Oyun Bitti!</h2>
            <p>Skorunuz: <span id="finalScore" style="color: var(--primary-color); font-weight: bold;">0</span></p>
            <button class="btn" id="tryAgainBtn" style="width: 80%;">Tekrar Dene</button>
        </div>
    </div>

    <script>
        const tilesContainer = document.getElementById('tilesContainer');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('bestScore');
        const restartBtn = document.getElementById('restartBtn');
        const tryAgainBtn = document.getElementById('tryAgainBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreElement = document.getElementById('finalScore');
        const boardContainer = document.getElementById('boardContainer');

        let grid = [];
        let score = 0;
        let bestScore = localStorage.getItem('neon2048BestScore') || 0;
        let tileIdCounter = 0;
        let tiles = {}; // Store tile objects by ID
        let isGameOver = false;

        bestScoreElement.textContent = bestScore;

        // Configuration
        const gap = 10; // Match the gap in CSS
        
        function getTileSize() {
            const containerWidth = tilesContainer.clientWidth;
            return (containerWidth - (gap * 3)) / 4;
        }

        // Window resize handling
        let tileSize = getTileSize();
        window.addEventListener('resize', () => {
            tileSize = getTileSize();
            updateAllTilePositions();
        });

        function initGame() {
            grid = [
                [null, null, null, null],
                [null, null, null, null],
                [null, null, null, null],
                [null, null, null, null]
            ];
            score = 0;
            updateScore();
            isGameOver = false;
            gameOverOverlay.classList.remove('active');
            
            // Clear DOM
            tilesContainer.innerHTML = '';
            tiles = {};
            
            // Add initial tiles
            addRandomTile();
            addRandomTile();
            
            // Allow time for DOM calculation
            setTimeout(() => {
                tileSize = getTileSize();
                updateAllTilePositions();
            }, 50);
        }

        function getEmptyCells() {
            const emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === null) {
                        emptyCells.push({r, c});
                    }
                }
            }
            return emptyCells;
        }

        function addRandomTile() {
            const emptyCells = getEmptyCells();
            if (emptyCells.length === 0) return;

            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            
            const tileId = `tile-${tileIdCounter++}`;
            const tile = {
                id: tileId,
                r: randomCell.r,
                c: randomCell.c,
                value: value,
                element: null,
                isNew: true
            };

            grid[randomCell.r][randomCell.c] = tile;
            tiles[tileId] = tile;
            
            createTileElement(tile);
        }

        function createTileElement(tile) {
            const el = document.createElement('div');
            el.id = tile.id;
            el.className = `tile tile-${tile.value} tile-new`;
            el.textContent = tile.value;
            
            el.style.width = `${tileSize}px`;
            el.style.height = `${tileSize}px`;
            
            const pos = calculatePosition(tile.r, tile.c);
            el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
            
            tile.element = el;
            tilesContainer.appendChild(el);
            
            // Remove animation class after it plays
            setTimeout(() => {
                if (el) el.classList.remove('tile-new');
            }, 200);
        }

        function calculatePosition(r, c) {
            return {
                x: c * (tileSize + gap),
                y: r * (tileSize + gap)
            };
        }

        function updateAllTilePositions() {
            for (let id in tiles) {
                const tile = tiles[id];
                if (tile.element) {
                    tile.element.style.width = `${tileSize}px`;
                    tile.element.style.height = `${tileSize}px`;
                    const pos = calculatePosition(tile.r, tile.c);
                    tile.element.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                }
            }
        }

        function updateScore() {
            scoreElement.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('neon2048BestScore', bestScore);
            }
        }

        function move(direction) {
            if (isGameOver) return;

            let moved = false;
            let mergedThisTurn = [];

            // Directions: 0: up, 1: right, 2: down, 3: left
            const vector = getVector(direction);
            const traversals = buildTraversals(vector);

            traversals.x.forEach(c => {
                traversals.y.forEach(r => {
                    const tile = grid[r][c];
                    
                    if (tile !== null) {
                        const positions = findFarthestPosition({r, c}, vector);
                        const next = grid[positions.next.r]?.[positions.next.c];

                        // Match logic
                        if (next && next.value === tile.value && !mergedThisTurn.includes(next.id)) {
                            // Merge
                            const mergedValue = tile.value * 2;
                            score += mergedValue;
                            updateScore();

                            // Update tile state
                            grid[r][c] = null;
                            const oldNext = grid[positions.next.r][positions.next.c];
                            
                            // Remove old next visually later
                            setTimeout(() => {
                                if (oldNext.element && oldNext.element.parentNode) {
                                    oldNext.element.parentNode.removeChild(oldNext.element);
                                }
                                delete tiles[oldNext.id];
                            }, 150);

                            tile.r = positions.next.r;
                            tile.c = positions.next.c;
                            tile.value = mergedValue;
                            grid[positions.next.r][positions.next.c] = tile;
                            mergedThisTurn.push(tile.id);
                            
                            // Visual update
                            const pos = calculatePosition(tile.r, tile.c);
                            tile.element.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                            
                            // Update class for color and text
                            setTimeout(() => {
                                tile.element.className = `tile tile-${tile.value > 2048 ? 'super' : tile.value} tile-merged`;
                                tile.element.textContent = tile.value;
                                setTimeout(() => tile.element.classList.remove('tile-merged'), 150);
                            }, 100);

                            moved = true;
                        } else if (positions.farthest.r !== r || positions.farthest.c !== c) {
                            // Move without merge
                            grid[r][c] = null;
                            tile.r = positions.farthest.r;
                            tile.c = positions.farthest.c;
                            grid[tile.r][tile.c] = tile;
                            
                            const pos = calculatePosition(tile.r, tile.c);
                            tile.element.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                            
                            moved = true;
                        }
                    }
                });
            });

            if (moved) {
                setTimeout(() => {
                    addRandomTile();
                    if (checkGameOver()) {
                        handleGameOver();
                    }
                }, 150);
            }
        }

        function getVector(direction) {
            const map = {
                0: { r: -1, c: 0 }, // Up
                1: { r: 0, c: 1 },  // Right
                2: { r: 1, c: 0 },  // Down
                3: { r: 0, c: -1 }  // Left
            };
            return map[direction];
        }

        function buildTraversals(vector) {
            let traversals = { x: [0, 1, 2, 3], y: [0, 1, 2, 3] };
            
            if (vector.c === 1) traversals.x = traversals.x.reverse();
            if (vector.r === 1) traversals.y = traversals.y.reverse();
            
            return traversals;
        }

        function findFarthestPosition(cell, vector) {
            let previous;
            
            do {
                previous = cell;
                cell = { r: previous.r + vector.r, c: previous.c + vector.c };
            } while (isWithinBounds(cell) && grid[cell.r][cell.c] === null);

            return {
                farthest: previous,
                next: cell // Used to check if a merge is possible
            };
        }

        function isWithinBounds(position) {
            return position.r >= 0 && position.r < 4 && position.c >= 0 && position.c < 4;
        }

        function checkGameOver() {
            if (getEmptyCells().length > 0) return false;

            // Check for possible merges
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const tile = grid[r][c];
                    if (tile) {
                        for (let direction = 0; direction < 4; direction++) {
                            const vector = getVector(direction);
                            const nextR = r + vector.r;
                            const nextC = c + vector.c;

                            if (isWithinBounds({r: nextR, c: nextC})) {
                                const nextTile = grid[nextR][nextC];
                                if (nextTile && nextTile.value === tile.value) {
                                    return false; // Merge possible
                                }
                            }
                        }
                    }
                }
            }
            return true; // No empty cells, no merges possible
        }

        function handleGameOver() {
            isGameOver = true;
            finalScoreElement.textContent = score;
            setTimeout(() => {
                gameOverOverlay.classList.add('active');
            }, 300);
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault(); move(0); break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault(); move(1); break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault(); move(2); break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault(); move(3); break;
            }
        });

        // Touch handling
        let touchStartX = 0;
        let touchStartY = 0;

        boardContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});

        boardContainer.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling while swiping on the board
        }, {passive: false});

        boardContainer.addEventListener('touchend', (e) => {
            if (isGameOver) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) > 30) { // Minimum swipe distance
                if (absDx > absDy) {
                    // Horizontal swipe
                    if (dx > 0) move(1); // Right
                    else move(3); // Left
                } else {
                    // Vertical swipe
                    if (dy > 0) move(2); // Down
                    else move(0); // Up
                }
            }
        });

        restartBtn.addEventListener('click', initGame);
        tryAgainBtn.addEventListener('click', initGame);

        // Start game
        initGame();
    </script>
</body>
</html>
