<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Stacker - 3D Blok Yığma Oyunu</title>
    <!-- Outfit Font from Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03001e;
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --perfect-glow: #00ffcc;
            --accent-glow: #ff007f;
            --container-bg: rgba(10, 5, 25, 0.7);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0d002d 0%, var(--bg-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            touch-action: none;
        }

        .wrapper {
            background: var(--container-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        inset 0 0 20px rgba(0, 242, 254, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            width: min(95vw, 440px);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 800;
            font-size: 2.3rem;
            background: linear-gradient(90deg, var(--primary-glow), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
            margin-bottom: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .stats-panel {
            display: flex;
            gap: 20px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            width: 100%;
            justify-content: space-around;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .stat-label {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            transition: transform 0.1s ease;
        }

        .score-box .stat-value {
            color: var(--primary-glow);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .combo-box .stat-value {
            color: var(--perfect-glow);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        .best-box .stat-value {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .canvas-container {
            position: relative;
            padding: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
            width: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            border-radius: 15px;
            background: rgba(3, 0, 30, 0.95);
            width: 100%;
            height: 480px;
            cursor: pointer;
        }

        .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .screen-overlay {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: rgba(5, 2, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .screen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .screen-overlay h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-glow);
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .screen-overlay p {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .screen-overlay p span {
            font-weight: 800;
            color: var(--primary-glow);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .btn {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.15), rgba(255, 0, 127, 0.15));
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #ffffff;
            padding: 14px 34px;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.3), rgba(255, 0, 127, 0.3));
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.3);
            border-color: var(--primary-glow);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Perfect pop effect */
        .perfect-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--perfect-glow);
            text-shadow: 0 0 25px rgba(0, 255, 204, 0.8), 0 0 50px rgba(0, 255, 204, 0.4);
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .perfect-text.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Flash overlay for Perfect hits */
        .flash-overlay {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: white;
            border-radius: 15px;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
        }

        @keyframes flash-anim {
            0% { opacity: 0.35; }
            100% { opacity: 0; }
        }

        .flash-active {
            animation: flash-anim 0.35s ease-out forwards;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 16px;
                border-radius: 20px;
                gap: 12px;
            }
            canvas {
                height: 400px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .screen-overlay h2 {
                font-size: 1.8rem;
            }
            .btn {
                padding: 12px 28px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>Neon Stacker</h1>
        
        <div class="stats-panel">
            <div class="stat-box score-box">
                <span class="stat-label">Skor</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box combo-box">
                <span class="stat-label">Combo</span>
                <span class="stat-value" id="combo">0</span>
            </div>
            <div class="stat-box best-box">
                <span class="stat-label">En İyi</span>
                <span class="stat-value" id="bestScore">0</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="520"></canvas>
            
            <!-- Perfect hit notification text -->
            <div class="perfect-text" id="perfectText">KUSURSUZ!</div>
            
            <!-- White flash effect -->
            <div class="flash-overlay" id="flashOverlay"></div>

            <!-- Start screen -->
            <div class="screen-overlay active" id="startScreen">
                <h2 style="color: var(--primary-glow); text-shadow: 0 0 25px rgba(0, 242, 254, 0.6);">Kuleyi İnşa Et</h2>
                <p style="margin-bottom: 20px; text-align: center; padding: 0 15px;">Blokları üst üste kusursuzca yerleştirip rekor kırabilir misin?</p>
                <button class="btn" id="startBtn">Oyuna Başla</button>
            </div>

            <!-- Game Over screen -->
            <div class="screen-overlay" id="gameOverScreen">
                <h2>Yıkıldın!</h2>
                <p>Ulaşılan Kule Yüksekliği: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">Tekrar Dene</button>
            </div>
        </div>
        
        <div class="hint">Yerleştirmek için ekrana <b>dokunun</b> veya <b>boşluk (Space)</b> tuşuna basın.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const bestScoreEl = document.getElementById('bestScore');
        const finalScoreEl = document.getElementById('finalScore');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const perfectText = document.getElementById('perfectText');
        const flashOverlay = document.getElementById('flashOverlay');

        // Game Configuration constants
        const BLOCK_HEIGHT = 18;
        const INITIAL_SIZE = 140;
        const SLIDE_RANGE = 240;

        // Sound Engine (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playPerfectSound(comboCount) {
            initAudio();
            if (!audioCtx) return;

            // Musical major scale values (starts at C4 up to C5, D5, E5, etc.)
            const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
            const freq = scale[Math.min(comboCount, scale.length - 1)];

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Triangle wave for smooth chimes
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // Sweet delay / echo sub-oscillator
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(freq * 1.5, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);

            subGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);

            osc.connect(gainNode);
            subOsc.connect(subGain);

            gainNode.connect(audioCtx.destination);
            subGain.connect(audioCtx.destination);

            osc.start();
            subOsc.start();
            osc.stop(audioCtx.currentTime + 0.5);
            subOsc.stop(audioCtx.currentTime + 0.5);
        }

        function playChopSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.12);

            gainNode.gain.setValueAtTime(0.10, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playCrashSound() {
            initAudio();
            if (!audioCtx) return;

            // Generate retro synthetic explosion
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * 0.9;
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(12, audioCtx.currentTime + 0.7);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);

            noiseSource.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            // Add synth bass layer
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sawtooth';
            bassOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            bassOsc.frequency.linearRampToValueAtTime(25, audioCtx.currentTime + 0.7);

            bassGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            bassGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);

            bassOsc.connect(bassGain);
            bassGain.connect(audioCtx.destination);

            noiseSource.start();
            bassOsc.start();
            noiseSource.stop(audioCtx.currentTime + 0.8);
            bassOsc.stop(audioCtx.currentTime + 0.8);
        }


        // Game variables
        let bestScore = localStorage.getItem('neonStackerBest') || 0;
        bestScoreEl.textContent = bestScore;

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 0;
        
        let stack = [];
        let debris = [];
        let particles = [];
        let stars = [];

        // Camera variables
        let cameraZ = 0;
        let targetCameraZ = 0;

        // Current sliding block state
        let currentBlock = null;
        let level = 1;
        let slideDirection = 1; // 1 or -1
        let slideSpeed = 2.2;
        let time = 0;
        let startHue = 220; // Synthwave Indigo

        // Star background generation
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.5 + 0.2
            });
        }

        // Project 3D coordinate (x,y,z) to 2D Screen
        function project(x, y, z) {
            // Isometric projection formula: 30 degree angles
            // cos(30) = 0.866, sin(30) = 0.5
            const isoX = (x - y) * 0.866;
            const isoY = (x + y) * 0.5 - (z - cameraZ);
            
            return {
                x: canvas.width / 2 + isoX,
                y: canvas.height * 0.73 - isoY
            };
        }

        // Draw 3D Box in Isometric Space
        function drawBlock(x, y, z, w, d, h, hue, isGlowing = false) {
            if (w <= 0 || d <= 0) return;

            // Define top face corners
            const p1 = project(x - w / 2, y - d / 2, z); // Back
            const p2 = project(x + w / 2, y - d / 2, z); // Right
            const p3 = project(x + w / 2, y + d / 2, z); // Front
            const p4 = project(x - w / 2, y + d / 2, z); // Left

            // Bottom corners for front faces
            const p3_bot = project(x + w / 2, y + d / 2, z - h); // Front bottom
            const p2_bot = project(x + w / 2, y - d / 2, z - h); // Right bottom
            const p4_bot = project(x - w / 2, y + d / 2, z - h); // Left bottom

            // Colors shaded based on lighting
            // Top: light base, Left: medium, Right: dark
            const topColor = `hsl(${hue}, 88%, 62%)`;
            const leftColor = `hsl(${hue}, 80%, 45%)`;
            const rightColor = `hsl(${hue}, 75%, 32%)`;

            // Neon glow setup if active (placed blocks glow, sliding glows slightly)
            if (isGlowing) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = `hsl(${hue}, 95%, 65%)`;
            } else {
                ctx.shadowBlur = 0;
            }

            // 1. Draw Top Face
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0; // Reset glow for sides to keep rendering sharp

            // 2. Draw Left-Front Face
            ctx.fillStyle = leftColor;
            ctx.beginPath();
            ctx.moveTo(p4.x, p4.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p3_bot.x, p3_bot.y);
            ctx.lineTo(p4_bot.x, p4_bot.y);
            ctx.closePath();
            ctx.fill();

            // 3. Draw Right-Front Face
            ctx.fillStyle = rightColor;
            ctx.beginPath();
            ctx.moveTo(p3.x, p3.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p2_bot.x, p2_bot.y);
            ctx.lineTo(p3_bot.x, p3_bot.y);
            ctx.closePath();
            ctx.fill();

            // Top Face Subtle Inner Grid Glow (Premium look)
            ctx.strokeStyle = `rgba(255, 255, 255, 0.25)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.stroke();
        }

        // Draw 3D neon foundation grid
        function drawGridBase() {
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
            ctx.lineWidth = 1;
            
            const size = 300;
            const step = 30;
            
            // X alignment lines
            for (let g = -size; g <= size; g += step) {
                const pStart = project(g, -size, 0);
                const pEnd = project(g, size, 0);
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.stroke();
            }
            
            // Y alignment lines
            for (let g = -size; g <= size; g += step) {
                const pStart = project(-size, g, 0);
                const pEnd = project(size, g, 0);
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.stroke();
            }
        }

        // Particle System
        function spawnPerfectParticles(x, y, z, w, d, hue) {
            const count = 18;
            for (let i = 0; i < count; i++) {
                // Random position on the edge of the block
                const px = x + (Math.random() - 0.5) * w;
                const py = y + (Math.random() - 0.5) * d;
                const pz = z;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2.5 + 1.5;
                
                particles.push({
                    x: px,
                    y: py,
                    z: pz,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    vz: Math.random() * 2.5 + 2.0, // Fly upwards
                    hue: hue,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.015,
                    size: Math.random() * 3.5 + 1.5
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                p.vz -= 0.12; // Gravity pull in 3D
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                const screenPos = project(p.x, p.y, p.z);
                
                ctx.fillStyle = `hsla(${p.hue}, 95%, 70%, ${p.life})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${p.hue}, 95%, 65%)`;
                ctx.beginPath();
                ctx.arc(screenPos.x, screenPos.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0; // Reset shadows
        }

        // Fall debris update
        function updateAndDrawDebris() {
            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.x += d.vx;
                d.y += d.vy;
                d.z += d.vz;
                d.vz -= 0.6; // Heavy gravity pull
                d.rot += d.vrot;

                // If fallen way below screen, destroy
                if (d.z < cameraZ - 200) {
                    debris.splice(i, 1);
                    continue;
                }

                // Render debris block with tumble rotation
                drawBlock(d.x, d.y, d.z, d.w, d.d, d.h, d.hue, false);
            }
        }

        // Setup the next sliding block
        function spawnNextBlock() {
            const prev = stack[stack.length - 1];
            const hue = (startHue + level * 5) % 360;
            
            // Target block height
            const z = prev.z + BLOCK_HEIGHT;
            
            // Adjust sliding speeds slightly as levels increase
            slideSpeed = Math.min(4.5, 2.2 + level * 0.08);

            if (level % 2 === 1) {
                // Slide along X-axis, y is fixed
                currentBlock = {
                    x: -SLIDE_RANGE,
                    y: prev.y,
                    z: z,
                    w: prev.w,
                    d: prev.d,
                    h: BLOCK_HEIGHT,
                    hue: hue
                };
            } else {
                // Slide along Y-axis, x is fixed
                currentBlock = {
                    x: prev.x,
                    y: -SLIDE_RANGE,
                    z: z,
                    w: prev.w,
                    d: prev.d,
                    h: BLOCK_HEIGHT,
                    hue: hue
                };
            }

            // Slide starts moving in positive direction
            slideDirection = 1;
        }

        // Core logic: Try to place the block
        function placeCurrentBlock() {
            if (gameState !== 'PLAYING' || !currentBlock) return;

            const prev = stack[stack.length - 1];
            const isXAxis = level % 2 === 1;

            if (isXAxis) {
                // Slicing calculations along X
                const deltaX = currentBlock.x - prev.x;
                const maxDelta = currentBlock.w;

                // Snapping for Perfect match
                if (Math.abs(deltaX) < 4.5) {
                    // Snap exactly
                    currentBlock.x = prev.x;
                    stack.push({...currentBlock});
                    
                    // Combo effect
                    combo++;
                    score += 10 + Math.floor(combo * 1.5);
                    playPerfectSound(combo);
                    
                    // Spawn fireworks!
                    spawnPerfectParticles(currentBlock.x, currentBlock.y, currentBlock.z, currentBlock.w, currentBlock.d, currentBlock.hue);
                    triggerPerfectFlash();

                    // Every 5 combo, expand block width back
                    if (combo > 0 && combo % 5 === 0) {
                        const targetW = Math.min(INITIAL_SIZE, currentBlock.w + 12);
                        // Add particle burst for expand feedback
                        spawnPerfectParticles(currentBlock.x, currentBlock.y, currentBlock.z, targetW, currentBlock.d, 120);
                        stack[stack.length - 1].w = targetW;
                    }
                } 
                // Overhang checked
                else if (Math.abs(deltaX) >= maxDelta) {
                    // Missed completely!
                    gameOver();
                    return;
                } 
                else {
                    // Normal cut
                    const newW = currentBlock.w - Math.abs(deltaX);
                    const newX = prev.x + deltaX / 2;

                    // Calculate overhang debris dimensions
                    const debrisW = Math.abs(deltaX);
                    const debrisX = deltaX > 0 
                        ? newX + newW / 2 + debrisW / 2 
                        : newX - newW / 2 - debrisW / 2;

                    // Spawn physical debris
                    debris.push({
                        x: debrisX,
                        y: currentBlock.y,
                        z: currentBlock.z,
                        w: debrisW,
                        d: currentBlock.d,
                        h: BLOCK_HEIGHT,
                        hue: currentBlock.hue,
                        vx: deltaX > 0 ? 1.5 : -1.5,
                        vy: 0,
                        vz: 0.5,
                        rot: 0,
                        vrot: (Math.random() - 0.5) * 0.08
                    });

                    // Update block properties
                    currentBlock.x = newX;
                    currentBlock.w = newW;
                    stack.push({...currentBlock});

                    combo = 0; // Reset perfect combo
                    score += 10;
                    playChopSound();
                }
            } 
            else {
                // Slicing calculations along Y
                const deltaY = currentBlock.y - prev.y;
                const maxDelta = currentBlock.d;

                // Snapping for Perfect match
                if (Math.abs(deltaY) < 4.5) {
                    currentBlock.y = prev.y;
                    stack.push({...currentBlock});

                    combo++;
                    score += 10 + Math.floor(combo * 1.5);
                    playPerfectSound(combo);
                    
                    spawnPerfectParticles(currentBlock.x, currentBlock.y, currentBlock.z, currentBlock.w, currentBlock.d, currentBlock.hue);
                    triggerPerfectFlash();

                    // Expand depth back on consecutive perfection
                    if (combo > 0 && combo % 5 === 0) {
                        const targetD = Math.min(INITIAL_SIZE, currentBlock.d + 12);
                        spawnPerfectParticles(currentBlock.x, currentBlock.y, currentBlock.z, currentBlock.w, targetD, 120);
                        stack[stack.length - 1].d = targetD;
                    }
                } 
                else if (Math.abs(deltaY) >= maxDelta) {
                    gameOver();
                    return;
                } 
                else {
                    // Normal cut
                    const newD = currentBlock.d - Math.abs(deltaY);
                    const newY = prev.y + deltaY / 2;

                    const debrisD = Math.abs(deltaY);
                    const debrisY = deltaY > 0 
                        ? newY + newD / 2 + debrisD / 2 
                        : newY - newD / 2 - debrisD / 2;

                    debris.push({
                        x: currentBlock.x,
                        y: debrisY,
                        z: currentBlock.z,
                        w: currentBlock.w,
                        d: debrisD,
                        h: BLOCK_HEIGHT,
                        hue: currentBlock.hue,
                        vx: 0,
                        vy: deltaY > 0 ? 1.5 : -1.5,
                        vz: 0.5,
                        rot: 0,
                        vrot: (Math.random() - 0.5) * 0.08
                    });

                    currentBlock.y = newY;
                    currentBlock.d = newD;
                    stack.push({...currentBlock});

                    combo = 0;
                    score += 10;
                    playChopSound();
                }
            }

            // Update scores in interface
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            // Pan camera up to center top
            if (stack.length > 5) {
                targetCameraZ = (stack.length - 5) * BLOCK_HEIGHT;
            }

            // Next block level
            level++;
            spawnNextBlock();
        }

        // Trigger flash element animation
        function triggerPerfectFlash() {
            flashOverlay.classList.remove('flash-active');
            void flashOverlay.offsetWidth; // Force CSS reflow
            flashOverlay.classList.add('flash-active');

            perfectText.classList.remove('active');
            void perfectText.offsetWidth; // Force CSS reflow
            perfectText.classList.add('active');
            
            setTimeout(() => {
                perfectText.classList.remove('active');
            }, 500);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playCrashSound();

            // Create falling debris for the final sliding block
            debris.push({
                x: currentBlock.x,
                y: currentBlock.y,
                z: currentBlock.z,
                w: currentBlock.w,
                d: currentBlock.d,
                h: currentBlock.h,
                hue: currentBlock.hue,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                vz: 2,
                rot: 0,
                vrot: (Math.random() - 0.5) * 0.15
            });

            currentBlock = null;

            // Record high score
            const gameHeight = stack.length - 1; // Base block does not count
            if (gameHeight > bestScore) {
                bestScore = gameHeight;
                localStorage.setItem('neonStackerBest', bestScore);
                bestScoreEl.textContent = bestScore;
            }

            finalScoreEl.textContent = gameHeight;
            gameOverScreen.classList.add('active');
        }

        function resetGame() {
            score = 0;
            combo = 0;
            level = 1;
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            // Initial stack setup: Base Pedestal + Ground block
            stack = [
                {
                    x: 0,
                    y: 0,
                    z: 0,
                    w: INITIAL_SIZE,
                    d: INITIAL_SIZE,
                    h: BLOCK_HEIGHT,
                    hue: startHue
                }
            ];

            debris = [];
            particles = [];
            
            cameraZ = 0;
            targetCameraZ = 0;
            time = 0;

            gameOverScreen.classList.remove('active');
            startScreen.classList.remove('active');
            
            gameState = 'PLAYING';
            spawnNextBlock();
        }

        // Draw Ambient Scrolling Background
        function drawBackground() {
            // Dynamic colorful ambient gradient
            const currentHue = (startHue + stack.length * 3) % 360;
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            
            grad.addColorStop(0, `hsl(${(currentHue + 160) % 360}, 65%, 4%)`);
            grad.addColorStop(1, `hsl(${(currentHue + 210) % 360}, 70%, 1%)`);
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars parallax scroll
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            stars.forEach(s => {
                // Parallax depth offset based on camera scrolling
                const sY = (s.y + cameraZ * 0.18) % canvas.height;
                ctx.beginPath();
                ctx.arc(s.x, sY, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Main game rendering loop
        function draw() {
            drawBackground();
            drawGridBase();

            // 1. Draw entire tower stack (bottom-to-top painters algorithm)
            stack.forEach((b, idx) => {
                // Top block glows slightly if playing
                const isTop = idx === stack.length - 1;
                drawBlock(b.x, b.y, b.z, b.w, b.d, b.h, b.hue, isTop && gameState === 'PLAYING');
            });

            // 2. Draw active sliding block
            if (gameState === 'PLAYING' && currentBlock) {
                drawBlock(currentBlock.x, currentBlock.y, currentBlock.z, currentBlock.w, currentBlock.d, currentBlock.h, currentBlock.hue, true);
            }

            // 3. Draw physical elements
            updateAndDrawDebris();
            updateAndDrawParticles();
        }

        // Game update math calculations
        function update() {
            if (gameState !== 'PLAYING' || !currentBlock) return;

            time += 0.016; // Standard dt

            const isXAxis = level % 2 === 1;
            const osc = Math.sin(time * slideSpeed) * SLIDE_RANGE;

            if (isXAxis) {
                currentBlock.x = osc;
            } else {
                currentBlock.y = osc;
            }

            // Lerp camera vertical offset smoothly
            cameraZ += (targetCameraZ - cameraZ) * 0.085;
        }

        // 60FPS animation loop
        function tick() {
            update();
            draw();
            requestAnimationFrame(tick);
        }

        // Inputs & Event Bindings
        function handlePlacementInput(e) {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                placeCurrentBlock();
            } else if (gameState === 'START') {
                initAudio();
                resetGame();
            }
        }

        // Mouse click/Touch screen tap triggers placing block
        canvas.addEventListener('mousedown', handlePlacementInput);
        canvas.addEventListener('touchstart', handlePlacementInput, { passive: false });

        // SPACEBAR key bindings
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                handlePlacementInput(e);
            }
        });

        // HTML triggers
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });
        
        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });

        // Initialize display drawing
        draw();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
