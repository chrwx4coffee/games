<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon XOX Oyunu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0914;
            --container-bg: rgba(20, 18, 30, 0.6);
            --primary-color: #00ffcc; /* Cyan for X */
            --secondary-color: #ff00ff; /* Magenta for O */
            --text-color: #ffffff;
            --grid-line: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a172e 0%, var(--bg-color) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
        }

        .game-wrapper {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: min(90vw, 450px);
            position: relative;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            text-align: center;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 5px;
        }

        .status {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            height: 24px;
            transition: color 0.3s;
        }

        .status.turn-x {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .status.turn-o {
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .cell {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--grid-line);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        .cell.x {
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            cursor: default;
        }

        .cell.o {
            color: var(--secondary-color);
            text-shadow: 0 0 20px var(--secondary-color);
            cursor: default;
        }

        /* Animation for X and O placement */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.x::after, .cell.o::after {
            content: attr(data-mark);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .scores {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .score-x .score-value { color: var(--primary-color); text-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
        .score-o .score-value { color: var(--secondary-color); text-shadow: 0 0 10px rgba(255, 0, 255, 0.4); }

        .btn-restart {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            outline: none;
        }

        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-restart:active {
            transform: translateY(1px);
        }

        /* Winning Line */
        .win-line {
            position: absolute;
            background: white;
            border-radius: 10px;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
        }

        .win-line.active {
            opacity: 1;
            box-shadow: 0 0 15px white;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 25px;
                border-radius: 20px;
            }
            .cell {
                font-size: 3rem;
                border-radius: 12px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div>
            <h1>Neon XOX</h1>
            <div class="status turn-x" id="statusText">Sıra: X</div>
        </div>

        <div class="board" id="board">
            <div class="win-line" id="winLine"></div>
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="scores">
            <div class="score-box score-x">
                <span class="score-label">Oyuncu X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score-box score-o">
                <span class="score-label">Oyuncu O</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>

        <button class="btn-restart" id="restartBtn">Oyunu Sıfırla</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('statusText');
        const restartBtn = document.getElementById('restartBtn');
        const scoreXElement = document.getElementById('scoreX');
        const scoreOElement = document.getElementById('scoreO');
        const winLine = document.getElementById('winLine');
        const board = document.getElementById('board');

        let boardState = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;
        let scoreX = 0;
        let scoreO = 0;

        const winningConditions = [
            [0, 1, 2], // Top row
            [3, 4, 5], // Middle row
            [6, 7, 8], // Bottom row
            [0, 3, 6], // Left col
            [1, 4, 7], // Middle col
            [2, 5, 8], // Right col
            [0, 4, 8], // Diagonal 1
            [2, 4, 6]  // Diagonal 2
        ];

        function initGame() {
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            restartBtn.addEventListener('click', restartGame);
            updateStatusText();
        }

        function handleCellClick(e) {
            const clickedCell = e.target;
            const cellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (boardState[cellIndex] !== "" || !gameActive) {
                return;
            }

            // Update state
            boardState[cellIndex] = currentPlayer;
            
            // Update UI
            clickedCell.setAttribute('data-mark', currentPlayer);
            clickedCell.classList.add(currentPlayer.toLowerCase());

            checkWin();
        }

        function checkWin() {
            let roundWon = false;
            let winningPattern = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const condition = winningConditions[i];
                const a = boardState[condition[0]];
                const b = boardState[condition[1]];
                const c = boardState[condition[2]];

                if (a === "" || b === "" || c === "") {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    winningPattern = condition;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `${currentPlayer} KAZANDI!`;
                gameActive = false;
                updateScore();
                drawWinLine(winningPattern);
                return;
            }

            let roundDraw = !boardState.includes("");
            if (roundDraw) {
                statusText.textContent = "BERABERE!";
                statusText.className = "status";
                statusText.style.color = "white";
                gameActive = false;
                return;
            }

            // Change player
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateStatusText();
        }

        function updateScore() {
            if (currentPlayer === "X") {
                scoreX++;
                scoreXElement.textContent = scoreX;
            } else {
                scoreO++;
                scoreOElement.textContent = scoreO;
            }
        }

        function updateStatusText() {
            statusText.textContent = `Sıra: ${currentPlayer}`;
            statusText.className = `status turn-${currentPlayer.toLowerCase()}`;
            statusText.style.color = ""; // Reset inline style
        }

        function drawWinLine(pattern) {
            const cell0 = cells[pattern[0]];
            const cell2 = cells[pattern[2]];
            
            // Wait for next frame to ensure layout is updated
            requestAnimationFrame(() => {
                const boardRect = board.getBoundingClientRect();
                const cell0Rect = cell0.getBoundingClientRect();
                const cell2Rect = cell2.getBoundingClientRect();

                const startX = cell0Rect.left + cell0Rect.width / 2 - boardRect.left;
                const startY = cell0Rect.top + cell0Rect.height / 2 - boardRect.top;
                const endX = cell2Rect.left + cell2Rect.width / 2 - boardRect.left;
                const endY = cell2Rect.top + cell2Rect.height / 2 - boardRect.top;

                const distance = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                const angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

                winLine.style.width = `${distance}px`;
                winLine.style.height = '6px';
                winLine.style.left = `${startX}px`;
                winLine.style.top = `${startY - 3}px`; // -3 to center the 6px height
                winLine.style.transformOrigin = 'left center';
                winLine.style.transform = `rotate(${angle}deg)`;
                
                // Set color based on winner
                if (currentPlayer === "X") {
                    winLine.style.background = "var(--primary-color)";
                    winLine.style.boxShadow = "0 0 15px var(--primary-color)";
                } else {
                    winLine.style.background = "var(--secondary-color)";
                    winLine.style.boxShadow = "0 0 15px var(--secondary-color)";
                }

                winLine.classList.add('active');
            });
        }

        function restartGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            currentPlayer = "X";
            
            cells.forEach(cell => {
                cell.classList.remove('x', 'o');
                cell.removeAttribute('data-mark');
            });
            
            winLine.classList.remove('active');
            setTimeout(() => {
                winLine.style.width = '0';
            }, 300); // Wait for fade out
            
            updateStatusText();
        }

        // Handle window resize for win line
        window.addEventListener('resize', () => {
            if (!gameActive && !boardState.includes("") === false) { // Game won (not draw)
                // Find winning pattern to redraw line
                for (let i = 0; i < winningConditions.length; i++) {
                    const condition = winningConditions[i];
                    const a = boardState[condition[0]];
                    const b = boardState[condition[1]];
                    const c = boardState[condition[2]];

                    if (a !== "" && a === b && b === c) {
                        drawWinLine(condition);
                        break;
                    }
                }
            }
        });

        // Initialize
        initGame();
    </script>
</body>
</html>
